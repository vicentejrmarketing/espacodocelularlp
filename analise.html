<style>
html,body{margin:0;background:#000;min-height:100%}
*{box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pa-logo{display:flex;justify-content:center;padding:22px 0 0}
.pa-logo img{width:92px;height:auto}

.pa-wrap{background:#000;border-bottom:2px solid #FFC700;color:#fff;padding:56px 20px 64px;font-family:"DM Sans",Sans-serif}
.pa-box{max-width:560px;margin:0 auto;text-align:center}
.pa-box .pa-titulo{font-family:"Montserrat",Sans-serif;font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 16px;color:#fff;letter-spacing:-0.5px}
.pa-box .pa-lead{font-size:17px;line-height:1.55;color:#ddd;margin:0 0 32px}
.pa-box .pa-lead b{color:#FFC700}
.pa-form{background:#111;border:2px solid #FFC700;border-radius:14px;padding:28px 22px;text-align:left}
.pa-field{margin-bottom:18px}
.pa-field label{display:block;font-weight:700;font-size:14px;letter-spacing:.5px;color:#FFC700;margin-bottom:6px;text-transform:uppercase}
.pa-field input,.pa-field select{width:100%;font:inherit;font-size:17px;padding:14px 14px;border-radius:8px;border:1px solid #444;background:#000;color:#fff;outline:none;appearance:none;-webkit-appearance:none}
.pa-field select{background-image:linear-gradient(45deg,transparent 50%,#FFC700 50%),linear-gradient(135deg,#FFC700 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.pa-field input:focus,.pa-field select:focus{border-color:#FFC700;box-shadow:0 0 0 3px #FFC70033}
.pa-field input.pa-bad{border-color:#ff5252}
.pa-err{display:none;color:#ff6b6b;font-size:13px;margin-top:5px}
.pa-field.has-err .pa-err{display:block}
.pa-submit{width:100%;margin-top:6px;border:none;border-radius:8px;cursor:pointer;font-family:"DM Sans",Sans-serif;font-size:18px;font-weight:700;line-height:1.2;color:#000;padding:17px 20px;background-image:linear-gradient(180deg,#FFD21F 0%,#E0A500 100%);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px #FFC70033;transition:transform .15s}
.pa-submit:hover{transform:translateY(-1px)}
.pa-submit svg{width:20px;height:20px;fill:#000;flex-shrink:0}
.pa-note{font-size:13px;color:#999;text-align:center;margin:14px 0 0}
.pa-step{background:#111;border:2px solid #FFC700;border-radius:14px;padding:40px 24px;text-align:center}
.pa-step h2{font-family:"Montserrat",Sans-serif;font-weight:800;font-size:clamp(24px,5vw,32px);line-height:1.15;color:#fff;margin:0 0 10px}
.pa-step p{font-size:17px;line-height:1.55;color:#ddd;margin:0}
.pa-bar{height:16px;background:#000;border:1px solid #333;border-radius:99px;overflow:hidden;margin:26px 0 10px}
.pa-bar i{display:block;height:100%;width:0;background-image:linear-gradient(90deg,#E0A500,#FFD21F);border-radius:99px}
.pa-etapa{font-weight:700;color:#fff;font-size:17px;margin:4px 0 6px;min-height:24px;transition:opacity .25s}
.pa-nome{display:block;color:#FFC700;margin-bottom:4px}
.pa-pct{font-weight:700;color:#FFC700;font-size:15px}
.pa-spin{width:46px;height:46px;border:4px solid #FFC70033;border-top-color:#FFC700;border-radius:50%;margin:0 auto 18px;animation:paSpin 1s linear infinite}
@keyframes paSpin{to{transform:rotate(360deg)}}
.pa-ok{font-size:54px;line-height:1;margin-bottom:12px}
.pa-cta{display:flex;margin-top:26px;text-decoration:none;color:#000!important}
.pa-hero{display:block;width:min(340px,82%);height:auto;margin:0 auto -2px;position:relative;z-index:1}
.pa-cta.pa-sem-agenda{opacity:.45;cursor:not-allowed}
.pa-cta svg{width:22px;height:22px;fill:#000;flex-shrink:0}
.pa-aviso{font-size:12px!important;color:#aaa!important;margin:10px 0 0!important;line-height:1.4}
.pa-registro{font-size:13px;color:#ffcf5a;margin:8px 0 0;min-height:0}
.pa-cal-msg{font-size:14px;color:#ddd;margin:12px 0 0;min-height:1em}
.pa-field select.pa-bad{border-color:#ff5252}
.pa-nova{font-size:13px;font-weight:400;opacity:.8}
.pa-back{display:inline-block;margin-top:26px;color:#FFC700!important;font-weight:700;font-size:15px}


.pa-wrap{flex:1;display:flex;align-items:center;justify-content:center;border-bottom:0!important}
.pa-box{width:100%}
.pa-submit{text-decoration:none}
</style>
